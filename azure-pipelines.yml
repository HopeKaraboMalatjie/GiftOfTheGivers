trigger:
- main

pool:
  vmImage: windows-latest

variables:
  buildConfiguration: Release
  webProject: GiftOfTheGivers.csproj
  functionsProject: GiftOfTheGivers.Functions/GiftOfTheGivers.Functions.csproj
  helpersProject: GiftOfTheGivers.Helpers/GiftOfTheGivers.Helpers.csproj
  testProject: GiftOfTheGivers.Tests/GiftOfTheGivers.Tests.csproj

steps:
- checkout: self
  displayName: Checkout source

- task: UseDotNet@2
  displayName: Install .NET 8 SDK
  inputs:
    packageType: sdk
    version: 8.0.x

- script: dotnet restore GiftOfTheGivers.sln
  displayName: Restore NuGet packages

- script: dotnet build GiftOfTheGivers.sln --configuration $(buildConfiguration) --no-restore
  displayName: Build solution

- script: dotnet test $(testProject) --configuration $(buildConfiguration) --no-build --logger trx --results-directory $(Agent.TempDirectory)/test-results
  displayName: Run tests

- task: PublishTestResults@2
  displayName: Publish test results
  condition: succeededOrFailed()
  inputs:
    testResultsFormat: VSTest
    testResultsFiles: '$(Agent.TempDirectory)/test-results/*.trx'

- script: dotnet publish $(webProject) --configuration $(buildConfiguration) --no-build --output $(Build.ArtifactStagingDirectory)/web
  displayName: Publish ASP.NET Core application

- script: dotnet publish $(functionsProject) --configuration $(buildConfiguration) --no-build --output $(Build.ArtifactStagingDirectory)/functions
  displayName: Publish Azure Functions application

- script: dotnet pack $(helpersProject) --configuration $(buildConfiguration) --no-build --output $(Build.ArtifactStagingDirectory)/packages
  displayName: Pack helper NuGet package

- task: PublishBuildArtifacts@1
  displayName: Publish web artifact
  inputs:
    pathToPublish: $(Build.ArtifactStagingDirectory)/web
    artifactName: web

- task: PublishBuildArtifacts@1
  displayName: Publish Functions artifact
  inputs:
    pathToPublish: $(Build.ArtifactStagingDirectory)/functions
    artifactName: functions

- task: PublishBuildArtifacts@1
  displayName: Publish helper package artifact
  inputs:
    pathToPublish: $(Build.ArtifactStagingDirectory)/packages
    artifactName: helpers-package

- script: dotnet nuget push "$(Build.ArtifactStagingDirectory)/packages/*.nupkg" --source "$(AzureArtifactsFeedUrl)" --api-key AzureDevOps --skip-duplicate
  displayName: Publish helper package to Azure Artifacts
  condition: and(succeeded(), ne(variables['AzureArtifactsFeedUrl'], ''))
